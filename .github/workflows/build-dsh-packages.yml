name: Build DSH packages (dev.lwff.dsh prefix)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated packages to build"
        default: "proot apt dpkg bash"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      TERMUX_PACKAGE_NAME: dev.lwff.dsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build docker image
        run: |
          docker build -t ghcr.io/termux/package-builder:latest scripts/
          docker buildx prune -af

      - name: Start container
        run: |
          ./scripts/run-docker.sh true

      - name: Pre-cache termux-elf-cleaner
        run: |
          mkdir -p $HOME/.termux-build/_cache
          for i in 1 2 3 4 5; do
            curl -fL --retry 5 --max-time 120 \
              -o $HOME/.termux-build/_cache/termux-elf-cleaner \
              https://github.com/termux/termux-elf-cleaner/releases/download/v3.0.1/termux-elf-cleaner \
              && break
            echo "retry $i"; sleep 5
          done
          chmod +x $HOME/.termux-build/_cache/termux-elf-cleaner
          ls -la $HOME/.termux-build/_cache/

      - name: Build packages
        run: |
          packages="${{ inputs.packages }}"
          for pkg in $packages; do
            echo "=== Building $pkg ==="
            if ! ./scripts/run-docker.sh -m ./build-package.sh -I -C -a aarch64 "$pkg"; then
              echo "=== BUILD FAILED: $pkg — dumping config.log ==="
              ./scripts/run-docker.sh -m "bash -c 'tail -60 /home/builder/.termux-build/${pkg}/src/config.log 2>/dev/null || find /home/builder/.termux-build -name config.log | head -3'" || true
              exit 1
            fi
          done

      - name: Upload debs
        uses: actions/upload-artifact@v6
        with:
          name: dsh-debs
          path: output/*.deb
          retention-days: 30
